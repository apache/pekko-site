name: Apache Pekko Site
permissions: read-all
on:
  pull_request:
  workflow_dispatch:
jobs:
  sbt:
    name: Check content folder
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: 0
      - name: Setup Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - name: Install sbt
        uses: sbt/setup-sbt@20cf087132cf939c160f0e53f87ba33634003e3e # v1.5.16
      - name: Build Paradox
        run: |-
          sbt clean paradox
      - name: Content folder up-to-date
        run: |-
          git diff --no-index target/paradox/site/main/ ./content/
          if [ $? -ne 0 ]; then
            echo "The content folder differs from the sources. Please update the content folder"
            exit 1
          else
            echo "No differences detected. Success."
          fi
